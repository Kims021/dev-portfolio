<section class="contact section" id="contact-section">

    <div class="container">

        <!-- HEADER -->

        <div class="contact-header hidden">

            <p class="section-label">GET IN TOUCH</p>

            <h2 class="section-title">Let's Work Together</h2>

            <p class="section-subtitle">
                Have a project in mind, a job opportunity, or just want to connect?
                Drop me a message and I'll get back to you.
            </p>

        </div>

        <!-- INFO STRIP -->

        <div class="contact-strip hidden">

            <div class="contact-chip">
                <span class="chip-icon">📧</span>
                <a href="mailto:kimmarin43@gmail.com">kimmarin43@gmail.com</a>
            </div>

            <div class="contact-chip-divider"></div>

            <div class="contact-chip">
                <span class="chip-icon">📍</span>
                <span>Imus, Cavite, Philippines</span>
            </div>

            <div class="contact-chip-divider"></div>

            <div class="contact-chip">
                <span class="chip-icon">🟢</span>
                <span class="contact-available">Open to Work</span>
            </div>

        </div>

            <div class="contact-orb contact-orb-2"></div>

                    <input type="text" id="contactSubject"
                        placeholder="Project Inquiry / Job Opportunity / Collaboration" required>
                </div>

                <div class="form-group">
                    <label for="contactMessage">Message</label>
                    <textarea id="contactMessage" rows="6"
                        placeholder="Tell me about your project, opportunity, or just say hi..." required></textarea>
                </div>

                    <div class="form-socials">
