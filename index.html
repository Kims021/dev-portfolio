<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ================================================= -->
    <!-- META -->
    <!-- ================================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- ================================================= -->
    <!-- TITLE -->
    <!-- ================================================= -->

    <title>

        Kim Julius Marin | Full Stack Developer

    </title>

    <!-- ================================================= -->
    <!-- GOOGLE FONTS -->
    <!-- ================================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    >

    <!-- ================================================= -->
    <!-- THEME INIT -->
    <!-- ================================================= -->

    <script>
        (function(){
            var t=localStorage.getItem("theme");
            if(!t){
                t="aurora";
                localStorage.setItem("theme",t);
            }
            document.documentElement.setAttribute("data-theme",t);
        })();
    </script>

    <!-- ================================================= -->
    <!-- GLOBAL VARIABLES -->
    <!-- ================================================= -->

    <link
        rel="stylesheet"
        href="./global/variables.css"
    >

    <!-- ================================================= -->
    <!-- GLOBAL CSS -->
    <!-- ================================================= -->

    <link
        rel="stylesheet"
        href="./global/global.css"
    >

</head>

<body>

    <!-- ================================================= -->
    <!-- LOADING SCREEN -->
    <!-- ================================================= -->

    <div id="loadingScreen">

        <div class="loader-initials">KJM</div>

        <div class="loader-bar">
            <div class="loader-fill"></div>
        </div>

    </div>

    <!-- ================================================= -->
    <!-- SCROLL PROGRESS -->
    <!-- ================================================= -->

    <div id="scrollProgress"></div>

    <!-- ================================================= -->
    <!-- 3D BACKGROUND CANVAS -->

    <canvas id="bgCanvas" class="bg-canvas"></canvas>

    <!-- ================================================= -->
    <!-- NAVBAR -->
    <!-- ================================================= -->

    <div id="navbar"></div>

    <!-- ================================================= -->
    <!-- HERO -->
    <!-- ================================================= -->

    <!-- ================================================= -->

    <!-- ================================================= -->

    <!-- ================================================= -->

    <div id="projects"></div>

    <!-- ================================================= -->

    <div id="contact"></div>

    <!-- ================================================= -->
    <!-- FOOTER -->
    <!-- ================================================= -->

    <div id="footer"></div>

    <!-- ================================================= -->
    <!-- BACKGROUND -->
    <!-- ================================================= -->

    <script src="./global/background.js"></script>

    <!-- ================================================= -->
    <!-- GLOBAL APP -->
    <!-- ================================================= -->

    <script
        src="./global/app.js?v=5"
    ></script>

    <!-- ================================================= -->
